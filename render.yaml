# Render.com Blueprint for OmniProxy AI Gateway
# ─────────────────────────────────────────────
# 100% FREE - No API keys required!
# Uses Pollinations.ai keyless free tier as primary provider.
# Optional: add GROQ_API_KEY, GEMINI_API_KEY etc. for extra reliability.
services:
  - type: web
    name: omniproxy-preplor
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # Set this key in Render dashboard so PrepLOR PHP can authenticate
      # Use any strong random string, e.g.: preplor-ai-2026-xyz
      - key: OMNIPROXY_API_KEY
        sync: false
      # ── All below are OPTIONAL — Pollinations.ai works without any keys ──
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: MISTRAL_API_KEY
      #   sync: false
      # - key: OPENROUTER_API_KEY
      #   sync: false
